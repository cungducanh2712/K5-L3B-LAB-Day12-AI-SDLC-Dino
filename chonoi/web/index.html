<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan" || (mode === "day" && snap.phase === "quan")) dy = -dy; // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function enqueueInput(input, force = false) {
  const s = JSON.stringify(input);
  if (!force && s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
function pushInput() { enqueueInput(currentInput()); }
function pulseInput(action) {
  const base = currentInput();
  enqueueInput({ ...base, ...action }, true);
  const release = { ...base };
  if (Object.prototype.hasOwnProperty.call(action, "shop_done")) release.shop_done = false;
  enqueueInput(release, true);
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (snap && snap.mode === "day" && snap.phase === "shop") {
    if (k === "1") { e.preventDefault(); pulseInput({ buy: "oxygen" }); return; }
    if (k === "2") { e.preventDefault(); pulseInput({ buy: "hp" }); return; }
    if (k === "enter") { e.preventDefault(); pulseInput({ shop_done: true }); return; }
  }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

cv.addEventListener("pointerdown", (e) => {
  if (!snap || snap.mode !== "day" || snap.phase !== "shop") return;
  const layout = shopLayout(innerWidth, innerHeight);
  const x = e.clientX, y = e.clientY;
  if (insideRect(x, y, layout.oxygen)) pulseInput({ buy: "oxygen" });
  else if (insideRect(x, y, layout.hp)) pulseInput({ buy: "hp" });
  else if (insideRect(x, y, layout.done)) pulseInput({ shop_done: true });
});

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    collectSummaryEvents(snap);
    observeHudState(snap);
    observePhase(snap);
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.size || 14) + "px 'Trebuchet MS', system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
let summaryDay = null, summaryMode = null, summaryLastTick = -1;
let shiftSummary = { fish: 0, revenue: 0, happy: 0, paid: 0, tips: 0 };
const summaryEventIds = new Set();
let hudLastHp = null, hpCrackTime = 0, previousPhase = null, phaseFlashUntil = 0;
function collectSummaryEvents(state) {
  if (!state || !["day", "gather", "quan"].includes(state.mode)) return;
  const day = state.day || 1;
  if (summaryMode !== state.mode || summaryDay !== day || Number(state.tick) < summaryLastTick) {
    summaryMode = state.mode; summaryDay = day; summaryLastTick = -1;
    shiftSummary = { fish: 0, revenue: 0, happy: 0, paid: 0, tips: 0 };
    summaryEventIds.clear();
  }
  summaryLastTick = Number(state.tick) || 0;
  const events = state.events || [];
  for (let i = 0; i < events.length; i++) {
    const event = events[i];
    if (event.day !== undefined && event.day !== day) continue;
    const data = event.data || {};
    const identity = [event.day, event.tick, event.name, data.fish_id || data.order_id || data.node_id || ""].join(":");
    if (summaryEventIds.has(identity)) continue;
    summaryEventIds.add(identity);
    if (event.name === "fish_caught") shiftSummary.fish++;
    else if (event.name === "paid") {
      shiftSummary.paid++;
      shiftSummary.happy++;
      shiftSummary.revenue += Number(data.amount) || 0;
      shiftSummary.tips += Number(data.tip) || 0;
    }
  }
}
function observeHudState(state) {
  const hp = state && state.player && state.player.hp;
  if (hp === undefined) { hudLastHp = null; return; }
  if (hudLastHp !== null && hp < hudLastHp) hpCrackTime = performance.now();
  hudLastHp = hp;
}
function observePhase(state) {
  if (!state || state.mode !== "day") { previousPhase = null; return; }
  if (previousPhase !== null && previousPhase !== state.phase && (state.phase === "quan" || state.phase === "shop")) phaseFlashUntil = performance.now() + 1350;
  previousPhase = state.phase;
}

function shopLayout(w, h) {
  const pw = Math.min(960, Math.max(280, w - 24)), ph = Math.min(620, Math.max(320, h - 24)), x = (w - pw) / 2, y = (h - ph) / 2;
  const panel = { x, y, w: pw, h: ph }, done = { x: x + pw - Math.min(190, pw - 40) - 24, y: y + ph - 58, w: Math.min(190, pw - 40), h: 42 };
  if (w < 680 && h > 450) {
    const margin = 22, gap = 12, cardW = pw - margin * 2, cardH = Math.min(160, Math.max(116, (ph - 230) / 2)), cardY = y + 112;
    return { panel, oxygen: { x: x + margin, y: cardY, w: cardW, h: cardH }, hp: { x: x + margin, y: cardY + cardH + gap, w: cardW, h: cardH }, done };
  }
  const gap = 22, margin = Math.min(38, Math.max(20, pw * 0.08)), cardY = y + Math.min(235, ph * 0.41), cardH = Math.min(166, ph * 0.34);
  const cardW = (pw - margin * 2 - gap) / 2;
  return { panel, oxygen: { x: x + margin, y: cardY, w: cardW, h: cardH }, hp: { x: x + margin + cardW + gap, y: cardY, w: cardW, h: cardH }, done };
}
function insideRect(x, y, r) { return r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

function woodPanel(x, y, w, h, radius = 12) {
  ctx.save();
  roundedPath(x, y, w, h, radius);
  const wood = ctx.createLinearGradient(x, y, x, y + h);
  wood.addColorStop(0, "#714b35"); wood.addColorStop(0.48, "#553a2d"); wood.addColorStop(1, "#3e2d27");
  ctx.fillStyle = wood; ctx.fill();
  ctx.strokeStyle = "#c49a60"; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = "rgba(243,211,151,.17)"; ctx.lineWidth = 1;
  for (let line = 1; line < 4; line++) { const yy = y + h * line / 4; ctx.beginPath(); ctx.moveTo(x + 8, yy); ctx.quadraticCurveTo(x + w * 0.5, yy + Math.sin(line * 7) * 2, x + w - 8, yy); ctx.stroke(); }
  ctx.restore();
}

function drawOxygenGauge(x, y, ticks, maxTicks, tick) {
  if (!maxTicks) return;
  const ratio = Math.max(0, Math.min(1, ticks / maxTicks)), low = ratio < 0.25, w = 222, h = 50;
  woodPanel(x, y, w, h, 15);
  text("OXY · BÌNH LẶN", x + 12, y + 15, { size: 9, color: "#f2ddb5" });
  const bx = x + 12, by = y + 22, bw = w - 24, bh = 17;
  ctx.save(); roundedPath(bx, by, bw, bh, bh / 2); ctx.fillStyle = "rgba(9,28,31,.88)"; ctx.fill(); ctx.clip();
  const blink = low && Math.floor(tick / 8) % 2 === 0;
  const fill = low ? (blink ? "#ff594e" : "#a83e39") : "#379ca0";
  ctx.fillStyle = fill; ctx.fillRect(bx, by, bw * ratio, bh);
  if (ratio > 0.02) {
    const waterEdge = bx + bw * ratio, wobble = Math.sin(tick * 0.12) * 1.6;
    ctx.strokeStyle = low ? "rgba(255,218,194,.72)" : "rgba(212,251,235,.7)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(bx, by + 3); ctx.quadraticCurveTo(bx + bw * ratio * 0.46, by + wobble, waterEdge, by + 3 - wobble); ctx.stroke();
  }
  ctx.fillStyle = low ? "rgba(255,192,146,.33)" : "rgba(202,246,230,.28)";
  for (let bubble = 0; bubble < 5; bubble++) {
    const bx0 = bx + ((bubble * 37 + tick * (low ? 0.45 : 0.22)) % Math.max(1, bw * Math.max(0.08, ratio)));
    const by0 = by + bh - 2 - ((bubble * 11 + tick * 0.8) % Math.max(3, bh - 2));
    if (bx0 < bx + bw * ratio) { ctx.beginPath(); ctx.arc(bx0, by0, bubble % 2 ? 1.5 : 2.2, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.restore();
  roundedPath(bx, by, bw, bh, bh / 2); ctx.strokeStyle = low ? "#eaa27f" : "#ddcfaa"; ctx.lineWidth = 1.5; ctx.stroke();
  text(Math.ceil(ticks / 60) + "s", x + w - 12, y + 16, { size: 11, align: "right", color: low ? "#ffb5a4" : "#fff0c7" });
  ctx.strokeStyle = "rgba(239,222,182,.6)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + 4, y + 31); ctx.quadraticCurveTo(x - 3, y + 41, x + 8, y + 44); ctx.stroke();
}

function drawHeartIcon(x, y, size, tick, filled, crack = false) {
  ctx.save(); ctx.translate(x, y); ctx.scale(size, size);
  const path = () => { ctx.beginPath(); ctx.moveTo(0, 0.42); ctx.bezierCurveTo(-0.17, 0.25, -0.62, -0.04, -0.62, -0.36); ctx.bezierCurveTo(-0.62, -0.75, -0.12, -0.82, 0, -0.45); ctx.bezierCurveTo(0.15, -0.84, 0.64, -0.7, 0.62, -0.34); ctx.bezierCurveTo(0.61, -0.02, 0.17, 0.27, 0, 0.42); ctx.closePath(); };
  path();
  const gradient = ctx.createLinearGradient(-0.25, -0.7, 0.3, 0.35);
  if (filled) { gradient.addColorStop(0, "#ff8c79"); gradient.addColorStop(0.48, "#d94f48"); gradient.addColorStop(1, "#813b37"); }
  else { gradient.addColorStop(0, "#8c6b57"); gradient.addColorStop(1, "#4b3a34"); }
  ctx.fillStyle = gradient; ctx.fill(); ctx.strokeStyle = "#d8b46c"; ctx.lineWidth = 0.075; ctx.stroke();
  if (filled) { ctx.strokeStyle = "rgba(255,231,190,.58)"; ctx.lineWidth = 0.045; ctx.beginPath(); ctx.moveTo(-0.32, -0.37); ctx.quadraticCurveTo(-0.22, -0.58, -0.05, -0.52); ctx.stroke(); }
  if (crack) { ctx.strokeStyle = "#4a2928"; ctx.lineWidth = 0.065; ctx.beginPath(); ctx.moveTo(0.04, -0.42); ctx.lineTo(-0.08, -0.12); ctx.lineTo(0.08, 0.02); ctx.lineTo(-0.04, 0.29); ctx.stroke(); }
  ctx.restore();
  if (crack && performance.now() - hpCrackTime < 380) {
    const age = (performance.now() - hpCrackTime) / 380, spread = size * (0.8 + age * 1.4);
    ctx.globalAlpha = 1 - age; ctx.fillStyle = "#eabf82";
    ctx.beginPath(); ctx.moveTo(x + size * 0.45, y - size * 0.2); ctx.lineTo(x + spread, y - spread * 0.65); ctx.lineTo(x + size * 0.55, y + size * 0.16); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - size * 0.45, y + size * 0.04); ctx.lineTo(x - spread, y + spread * 0.55); ctx.lineTo(x - size * 0.18, y + size * 0.18); ctx.fill(); ctx.globalAlpha = 1;
  }
}

function ingredientCounts(state) {
  const counts = {};
  if (Array.isArray(state.hold)) state.hold.forEach((kind) => { counts[kind] = (counts[kind] || 0) + 1; });
  else if (state.stock && typeof state.stock === "object") Object.keys(state.stock).forEach((kind) => { if (state.stock[kind] > 0) counts[kind] = state.stock[kind]; });
  return counts;
}

function drawIngredientIcon(kind, x, y, size) {
  ctx.save(); ctx.translate(x, y); ctx.scale(size, size);
  const colors = { ca_loc: "#768350", ca_linh: "#b9d4d4", ca_keo: "#c79a5b", bong_dien_dien: "#edc850", bong_sung: "#d77fae", keo_neo: "#80ae66" };
  ctx.fillStyle = colors[kind] || "#d2b985";
  if (kind === "bong_dien_dien") {
    ctx.strokeStyle = "#638046"; ctx.lineWidth = 0.12; ctx.beginPath(); ctx.moveTo(0, 0.36); ctx.lineTo(0, -0.32); ctx.stroke();
    for (let petal = 0; petal < 5; petal++) { const a = petal * Math.PI * 0.4; ctx.beginPath(); ctx.ellipse(Math.cos(a) * 0.13, -0.29 + Math.sin(a) * 0.13, 0.14, 0.08, a, 0, Math.PI * 2); ctx.fill(); }
  } else if (kind === "bong_sung") {
    for (let petal = 0; petal < 6; petal++) { const a = petal * Math.PI / 3; ctx.beginPath(); ctx.ellipse(Math.cos(a) * 0.18, Math.sin(a) * 0.18, 0.2, 0.08, a, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = "#f4d47b"; ctx.beginPath(); ctx.arc(0, 0, 0.07, 0, Math.PI * 2); ctx.fill();
  } else if (kind === "keo_neo") {
    ctx.strokeStyle = colors[kind]; ctx.lineWidth = 0.15; ctx.beginPath(); ctx.moveTo(0, 0.4); ctx.quadraticCurveTo(-0.1, 0, 0.04, -0.4); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0.16, -0.18, 0.24, 0.08, -0.3, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.ellipse(-0.02, 0, 0.37, kind === "ca_linh" ? 0.2 : 0.27, -0.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.32, 0); ctx.lineTo(-0.53, -0.22); ctx.lineTo(-0.5, 0.22); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#263630"; ctx.beginPath(); ctx.arc(0.24, -0.045, 0.04, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawBasketHud(state, x, y, w, h) {
  const counts = ingredientCounts(state), kinds = ["ca_loc", "ca_linh", "ca_keo", "bong_dien_dien", "bong_sung", "keo_neo"];
  const gap = 6, maxSlots = Math.max(1, Math.min(kinds.length, Math.floor((w - 24 + gap) / (38 + gap))));
  const present = kinds.filter((kind) => counts[kind] > 0);
  const slots = (present.length ? present : kinds.slice(0, 3)).slice(0, maxSlots);
  const slotW = Math.max(34, Math.min(94, (w - 26 - gap * Math.max(0, slots.length - 1)) / Math.max(1, slots.length))), panelW = Math.min(w, 16 + slots.length * (slotW + gap) - gap);
  woodPanel(x, y, panelW, h, 12);
  text(state.hold ? "GIỎ TRE" : "KHO BẾP", x + 12, y + 16, { size: 10, color: "#f0d8aa" });
  for (let i = 0; i < slots.length; i++) {
    const kind = slots[i], sx0 = x + 10 + i * (slotW + gap), sy0 = y + 23, sh = h - 31;
    ctx.fillStyle = "rgba(36,27,22,.52)"; roundedPath(sx0, sy0, slotW, sh, 6); ctx.fill();
    ctx.strokeStyle = "rgba(221,190,137,.58)"; ctx.lineWidth = 1; ctx.stroke();
    drawIngredientIcon(kind, sx0 + Math.min(19, slotW * 0.31), sy0 + sh / 2, Math.min(17, sh * 0.46));
    if (slotW >= 65) text(KIND_NAME[kind] || kind, sx0 + Math.min(39, slotW * 0.5), sy0 + sh / 2 + 4, { size: 9, color: "#f1e2c4" });
    text(String(counts[kind] || 0), sx0 + slotW - 6, sy0 + sh / 2 + 4, { size: 11, align: "right", color: "#ffd782" });
  }
  if (state.hold && state.hold_capacity) text(state.hold.length + "/" + state.hold_capacity, x + panelW - 9, y + 16, { size: 9, align: "right", color: "#e1c99d" });
}

function drawChalkboard(x, y, w, h, state) {
  woodPanel(x, y, w, h, 12);
  const rep = Number(state.reputation) || 0, stars = Math.max(0, Math.min(5, Math.round(rep)));
  text("QUÁN NHÀ BÈ", x + 14, y + 17, { size: 10, color: "#e0bd84" });
  text("Tiền  " + (state.money ?? 0) + "k", x + 14, y + 39, { size: 17, color: "#fff0c7" });
  text("Uy tín", x + 14, y + 59, { size: 11, color: "#f0dfbc" });
  text("★".repeat(stars) + "☆".repeat(5 - stars), x + 61, y + 59, { size: 13, color: "#f5ce6e" });
  if (state.day !== undefined) text("Ngày " + state.day, x + w - 12, y + 17, { size: 10, align: "right", color: "#f2ddb5" });
}

function drawActionHints(w, h, mode, phase) {
  const label = mode === "day" && phase === "shop" ? "1 · Mua bình oxy     2 · Mua tim     Enter · Hoàn tất" : mode === "gather" || (mode === "day" && phase === "gather") ? "WASD · Bơi     E · Hái / cập bến     Space · Bắt cá" : "WASD · Đi lại     E · Nấu / phục vụ";
  const width = Math.min(w - 24, 560), x = (w - width) / 2, y = h - 33;
  woodPanel(x, y, width, 25, 10);
  text(label, w / 2, y + 17, { size: 11, align: "center", color: "#f3e4c6" });
}

function drawGameHud(w, h, mode, phase) {
  const state = snap;
  if (state.player && state.player.oxygen_ticks !== undefined) {
    drawOxygenGauge(12, 70, state.player.oxygen_ticks, state.player.oxygen_max_ticks, state.tick || 0);
    const hp = state.player.hp || 0, max = state.player.hp_max || hp, hpX = 24, hpY = 135;
    woodPanel(12, 126, 222, 44, 13);
    text("SỨC KHỎE", hpX + 2, hpY + 8, { size: 9, color: "#f1dbb3" });
    for (let i = 0; i < max; i++) drawHeartIcon(hpX + 83 + i * 30, hpY + 4, 17, state.tick || 0, i < hp, i === hp && performance.now() - hpCrackTime < 380);
  }
  if (state.hold || state.stock) drawBasketHud(state, 12, h - 94, Math.min(w - 24, 630), 61);
  drawChalkboard(w - 214, 10, 202, 68, { ...state, day: state.day || (mode === "day" ? 1 : undefined) });
  if (state.time_left_ticks !== undefined) text("⏱ " + fmtTime(state.time_left_ticks), w / 2, 28, { size: 18, align: "center", color: "#fff1cf" });
  drawActionHints(w, h, mode, phase);
}

function eventLog(w, h) {
  const ev = (snap.events || []).slice(-6);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 70 - (ev.length - 1 - i) * 15, { size: 11, align: "right", color: "rgba(232,238,242,.75)" }));
}

function drawShopCard(card, title, detail, key, level, price, maxLevel, money, accent) {
  woodPanel(card.x, card.y, card.w, card.h, 15);
  const maxed = level >= maxLevel, canAfford = !maxed && money >= price;
  ctx.fillStyle = accent; roundedPath(card.x + 14, card.y + 14, 39, 39, 9); ctx.fill();
  if (key === "oxygen") {

// ---------- hiệu ứng Canvas: particle pool cố định, chỉ tái sử dụng ----------
const PARTICLE_COUNT = 150;
const PT_BUBBLE = 1, PT_FISH_BUBBLE = 2, PT_SMOKE = 3, PT_EMBER = 4, PT_POP = 5;
const particles = Array.from({ length: PARTICLE_COUNT }, () => ({
  active: false, mode: 0, type: 0, x: 0, y: 0, vx: 0, vy: 0,
  life: 0, maxLife: 0, size: 0, phase: 0, drift: 0
}));
let particleCursor = 0, particleSerial = 0, activeParticleMode = -1;
let gatherBubbleClock = 0, lowOxygenClock = 0, fishBubbleClock = 0;
let stoveSmokeClock = 0, stoveEmberClock = 0;
let oxygenBubbleCooldown = 0, lastObservedOxygen = null, lastEffectTick = null;
const fishPositionHistory = new Map();
let lastFishObservationTick = null;

function spawnParticle(mode, type, x, y, vx, vy, life, size, drift) {
  let chosen = -1;
  for (let n = 0; n < PARTICLE_COUNT; n++) {
    const i = (particleCursor + n) % PARTICLE_COUNT;
    if (!particles[i].active) { chosen = i; break; }
  }
  if (chosen < 0) chosen = particleCursor;
  particleCursor = (chosen + 1) % PARTICLE_COUNT;
  const p = particles[chosen];
  particleSerial++;
  p.active = true; p.mode = mode; p.type = type;
  p.x = x; p.y = y; p.vx = vx; p.vy = vy;
  p.life = life; p.maxLife = life; p.size = size;
  p.phase = (particleSerial * 2.399963229728653) % (Math.PI * 2);
  p.drift = drift;
}

function stepParticleSystem(dt, mode) {
  if (activeParticleMode !== mode) {
    for (let i = 0; i < PARTICLE_COUNT; i++) particles[i].active = false;
    activeParticleMode = mode;
    gatherBubbleClock = 0; lowOxygenClock = 0; fishBubbleClock = 0;
    stoveSmokeClock = 0; stoveEmberClock = 0;
    oxygenBubbleCooldown = 0; lastObservedOxygen = null; lastEffectTick = null;
    fishPositionHistory.clear(); lastFishObservationTick = null;
  }
  const currentTick = snap && Number(snap.tick) || 0;
  if (lastEffectTick !== null && currentTick < lastEffectTick) {
    for (let i = 0; i < PARTICLE_COUNT; i++) particles[i].active = false;
    gatherBubbleClock = 0; lowOxygenClock = 0; fishBubbleClock = 0;
    stoveSmokeClock = 0; stoveEmberClock = 0; oxygenBubbleCooldown = 0; lastObservedOxygen = null;
  }
  lastEffectTick = currentTick;
  oxygenBubbleCooldown = Math.max(0, oxygenBubbleCooldown - dt);
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const p = particles[i];
    if (!p.active || p.mode !== mode) continue;
    p.life -= dt;
    if (p.life <= 0) { p.active = false; continue; }
    if (p.type === PT_POP) continue;
    p.phase += dt * (p.type === PT_SMOKE ? 0.045 : 0.11);
    p.x += (p.vx + Math.sin(p.phase) * p.drift) * dt;
    p.y += p.vy * dt;
    if (mode === 0 && (p.type === PT_BUBBLE || p.type === PT_FISH_BUBBLE) && p.y <= 0.5) {
      p.type = PT_POP; p.y = 0.5; p.vx = 0; p.vy = 0;
      p.life = 5; p.maxLife = 5; p.size *= 0.8;
    }
  }

  if (mode === 0) {
    const fish = snap.fish || [];
    if (lastFishObservationTick !== currentTick) {
      for (let i = 0; i < fish.length; i++) {
        const f = fish[i];
        if (!f.pos) continue;
        let previous = fishPositionHistory.get(f.id);
        if (!previous) {
          previous = { x: f.pos[0], d: f.pos[1], moving: false };
          fishPositionHistory.set(f.id, previous);
        } else {
          previous.moving = Math.abs(f.pos[0] - previous.x) + Math.abs(f.pos[1] - previous.d) > 0.002;
          previous.x = f.pos[0]; previous.d = f.pos[1];
        }
      }
      lastFishObservationTick = currentTick;
    }
    const p = snap && snap.player;
    if (p && p.pos && (p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface)) {
      const velocity = p.vel || [0, 0];
      const moving = Math.hypot(velocity[0] || 0, velocity[1] || 0) > 0.15;
      const lowOxygen = p.oxygen_ticks !== undefined && p.oxygen_max_ticks && p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
      const oxygenFalling = p.oxygen_ticks !== undefined && lastObservedOxygen !== null && p.oxygen_ticks < lastObservedOxygen;
      if (moving) {
        gatherBubbleClock += dt;
        while (gatherBubbleClock >= 12) {
          gatherBubbleClock -= 12;
          spawnParticle(0, PT_BUBBLE, p.pos[0], p.pos[1], 0, -0.045, Math.max(120, (p.pos[1] + 1) / 0.045 + 60), 0.075, 0.012);
        }
      } else gatherBubbleClock = 0;
      if (oxygenFalling && oxygenBubbleCooldown <= 0) {
        spawnParticle(0, PT_BUBBLE, p.pos[0], p.pos[1], 0, -0.045, Math.max(120, (p.pos[1] + 1) / 0.045 + 60), 0.085, 0.014);
        oxygenBubbleCooldown = 14;
      }
      if (lowOxygen) {
        lowOxygenClock += dt;
        while (lowOxygenClock >= 14) {
          lowOxygenClock -= 14;
          spawnParticle(0, PT_BUBBLE, p.pos[0], p.pos[1], 0, -0.052, Math.max(120, (p.pos[1] + 1) / 0.052 + 60), 0.09, 0.016);
        }
      } else lowOxygenClock = 0;
      lastObservedOxygen = p.oxygen_ticks === undefined ? null : p.oxygen_ticks;
    } else { gatherBubbleClock = 0; lowOxygenClock = 0; oxygenBubbleCooldown = 0; lastObservedOxygen = null; }

    fishBubbleClock += dt;
    while (fishBubbleClock >= 18) {
      fishBubbleClock -= 18;
      for (let i = 0; i < fish.length; i++) {
        const f = fish[i];
        const trail = fishPositionHistory.get(f.id);
        if (!f.pos || f.pos[1] <= 0.6 || !trail || !trail.moving) continue;
        const heading = (f.heading_deg || 0) * Math.PI / 180;
        const tailX = f.pos[0] - Math.cos(heading) * 0.9;
        const tailD = f.pos[1] - Math.sin(heading) * 0.9;
        spawnParticle(0, PT_FISH_BUBBLE, tailX, tailD, -Math.cos(heading) * 0.012, -0.05, 90, 0.045, 0.008);
      }
    }
  } else {
    const stoves = snap.stoves || [];
    let cooking = false;
    for (let i = 0; i < stoves.length; i++) if (stoves[i].state === "cooking") { cooking = true; break; }
    if (cooking) {
      stoveSmokeClock += dt; stoveEmberClock += dt;
      while (stoveSmokeClock >= 10) {
        stoveSmokeClock -= 10;
        for (let i = 0; i < stoves.length; i++) {
          const st = stoves[i];
          if (st.state === "cooking" && st.pos) spawnParticle(1, PT_SMOKE, st.pos[0], st.pos[1] + 0.55, 0, 0.012, 78, 0.16, 0.006);
        }
      }
      while (stoveEmberClock >= 28) {
        stoveEmberClock -= 28;
        for (let i = 0; i < stoves.length; i++) {
          const st = stoves[i];
          if (st.state === "cooking" && st.pos) spawnParticle(1, PT_EMBER, st.pos[0], st.pos[1] + 0.35, 0, 0.035, 24, 0.055, 0.012);
        }
      }
    } else { stoveSmokeClock = 0; stoveEmberClock = 0; }
  }
}

function drawParticles(mode, sx, sy, scale) {
  ctx.save();
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const p = particles[i];
    if (!p.active || p.mode !== mode) continue;
    const x = sx(p.x), y = sy(p.y);
    const remaining = Math.max(0, Math.min(1, p.life / p.maxLife));
    ctx.globalAlpha = remaining;
    if (p.type === PT_BUBBLE || p.type === PT_FISH_BUBBLE) {
      const r = Math.max(1, p.size * scale);
      ctx.fillStyle = p.type === PT_FISH_BUBBLE ? "rgba(225,249,255,.48)" : "rgba(210,245,255,.22)";
      ctx.strokeStyle = "rgba(235,252,255,.8)"; ctx.lineWidth = Math.max(1, scale * 0.025);
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.35, Math.max(0.6, r * 0.22), 0, Math.PI * 2); ctx.fill();
    } else if (p.type === PT_POP) {
      const age = 1 - remaining;
      ctx.strokeStyle = "rgba(235,252,255,.8)"; ctx.lineWidth = Math.max(1, scale * 0.025);
      ctx.beginPath(); ctx.arc(x, y, Math.max(1, p.size * scale * (1 + age * 2)), 0, Math.PI * 2); ctx.stroke();
    } else if (p.type === PT_SMOKE) {
      const r = Math.max(1, (p.size + (1 - remaining) * 0.12) * scale);
      ctx.fillStyle = "rgba(42,35,33,.52)"; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(180,169,156,.28)"; ctx.beginPath(); ctx.arc(x - r * 0.16, y - r * 0.2, r * 0.55, 0, Math.PI * 2); ctx.fill();
    } else if (p.type === PT_EMBER) {
      const r = Math.max(1, p.size * scale * (0.55 + remaining * 0.5));
      ctx.fillStyle = "#ffbd55"; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

function waveHeight(x, tick) { return Math.sin(tick * 0.05 + x * 0.1) * 0.08; }
function traceWaterArea(sx, sy, X, D, scale, oy, tick) {
  ctx.beginPath();
  for (let x = 0; x < X; x += 1) {
    const y = oy + waveHeight(x, tick) * scale;
    if (x === 0) ctx.moveTo(sx(x), y); else ctx.lineTo(sx(x), y);
  }
  ctx.lineTo(sx(X), oy + waveHeight(X, tick) * scale);
  ctx.lineTo(sx(X), sy(D)); ctx.lineTo(sx(0), sy(D)); ctx.closePath();
}

function drawGodRays(sx, sy, X, D, scale, oy, tick) {
  ctx.save();
  traceWaterArea(sx, sy, X, D, scale, oy, tick); ctx.clip();
  ctx.fillStyle = "rgba(255, 235, 180, 0.08)";
  for (let i = 0; i < 5; i++) {
    const source = X * (0.08 + i * 0.2) + Math.sin(tick * 0.008 + i) * 0.35;
    const width = X * 0.035, lean = X * 0.13;
    ctx.beginPath();
    ctx.moveTo(sx(source - width), oy - scale * 6);
    ctx.lineTo(sx(source + width), oy - scale * 6);
    ctx.lineTo(sx(source - lean + width * 3), sy(D) + scale);
    ctx.lineTo(sx(source - lean - width * 3), sy(D) + scale);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawWarmLight(x, z, radiusUnits, scale, tick, phase) {
  const flicker = 0.94 + Math.sin(tick * 0.17 + phase) * 0.035 + Math.sin(tick * 0.071 + phase * 1.7) * 0.025;
  const radius = Math.max(1, scale * radiusUnits * flicker);
  const px = x, py = z;
  const glow = ctx.createRadialGradient(px, py, Math.max(1, radius * 0.04), px, py, radius);
  glow.addColorStop(0, "rgba(255, 197, 112, 0.30)");
  glow.addColorStop(0.42, "rgba(255, 169, 75, 0.16)");
  glow.addColorStop(1, "rgba(255, 150, 55, 0)");
  ctx.fillStyle = glow; ctx.fillRect(px - radius, py - radius, radius * 2, radius * 2);
}

function drawNightLighting(snap, sx, sy, X, Z, scale, tick) {
  ctx.save();
  ctx.fillStyle = "rgba(5, 12, 29, 0.78)";
  ctx.fillRect(sx(0), sy(Z), X * scale, Z * scale);
  ctx.globalCompositeOperation = "screen";
  const stoves = snap.stoves || [];
  for (let i = 0; i < stoves.length; i++) {
    const st = stoves[i];
    if (st.state === "cooking" && st.pos) drawWarmLight(sx(st.pos[0]), sy(st.pos[1]), 3.5, scale, tick, i * 2.1);
  }
  const tables = snap.tables || [];
  for (let i = 0; i < tables.length; i++) {
    const tb = tables[i];
    if (tb.pos) drawWarmLight(sx(tb.pos[0]), sy(tb.pos[1]), 2.8, scale, tick, i * 1.6 + 0.8);
  }
  ctx.restore();
}

// ----- minh họa mặt cắt sông: tất cả hình được dựng từ Canvas path -----
const monsterHeadingHistory = new Map();
let lastMonsterObservationTick = null;

function updateMonsterHeadingHistory(monsters, tick) {
  if (lastMonsterObservationTick !== null && tick < lastMonsterObservationTick) monsterHeadingHistory.clear();
  if (lastMonsterObservationTick === tick) return;
  for (let i = 0; i < monsters.length; i++) {
    const m = monsters[i];
    if (!m.pos) continue;
    let history = monsterHeadingHistory.get(m.id);
    if (!history) {
      history = { x: m.pos[0], d: m.pos[1], heading: 0 };
      monsterHeadingHistory.set(m.id, history);
    } else {
      const dx = m.pos[0] - history.x, dd = m.pos[1] - history.d;
      if (Math.abs(dx) + Math.abs(dd) > 0.00001) history.heading = Math.atan2(dd, dx);
      history.x = m.pos[0]; history.d = m.pos[1];
    }
  }
  lastMonsterObservationTick = tick;
}

function monsterHeading(m, player) {
  if (m.state === "chase" && player && player.pos) return Math.atan2(player.pos[1] - m.pos[1], player.pos[0] - m.pos[0]);
  const history = monsterHeadingHistory.get(m.id);
  return history ? history.heading : 0;
}

function artPhase(id) {
  const value = id == null ? "" : String(id);
  let hash = 0;
  for (let i = 0; i < value.length; i++) hash = (hash * 31 + value.charCodeAt(i)) | 0;
  return (hash >>> 0) % 628 / 100;
}

function drawGatherFish(f, sx, sy, scale, tick) {
  if (!f.pos) return;
  const phase = artPhase(f.id), u = Math.max(3, scale * 0.58);
  const wag = Math.sin(tick * 0.2 + phase) * 0.2 * u;
  const x = sx(f.pos[0]), y = sy(f.pos[1]);
  ctx.save(); ctx.translate(x, y); ctx.rotate((f.heading_deg || 0) * Math.PI / 180);
  ctx.lineJoin = "round"; ctx.lineCap = "round";

  // Đuôi, vây lưng và vây bụng chuyển động theo nhịp bơi.
  ctx.fillStyle = f.kind === "ca_linh" ? "#b8d2d1" : f.kind === "ca_keo" ? "#b18a50" : "#596746";
  ctx.beginPath(); ctx.moveTo(-0.95 * u, 0); ctx.lineTo(-1.48 * u, -0.42 * u + wag); ctx.lineTo(-1.4 * u, wag); ctx.lineTo(-1.48 * u, 0.42 * u + wag); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-0.35 * u, -0.22 * u); ctx.quadraticCurveTo(0, -0.67 * u, 0.46 * u, -0.25 * u); ctx.closePath(); ctx.fill();

  if (f.kind === "ca_loc") {
    const body = ctx.createLinearGradient(0, -0.38 * u, 0, 0.42 * u);

    ctx.lineTo(1.05 * u, 0.27 * u); ctx.bezierCurveTo(0.35 * u, 0.39 * u, -0.55 * u, 0.31 * u, -1.05 * u, 0); ctx.closePath();

    ctx.strokeStyle = "rgba(222,211,157,.65)"; ctx.lineWidth = 0.045 * u; ctx.beginPath(); ctx.moveTo(0.72 * u, -0.16 * u); ctx.quadraticCurveTo(0.6 * u, 0, 0.72 * u, 0.17 * u); ctx.stroke();

function drawCrocodile(m, player, sx, sy, scale, tick) {
  if (!m.pos) return;
  const phase = artPhase(m.id), u = Math.max(5, scale * 0.82), angle = monsterHeading(m, player);
  const x = sx(m.pos[0]), y = sy(m.pos[1]), chasing = m.state === "chase";
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle); ctx.lineJoin = "round"; ctx.lineCap = "round";
  if (chasing) {
    ctx.strokeStyle = "rgba(176,226,222,.5)"; ctx.lineWidth = Math.max(1, scale * 0.045);
    for (let ring = 0; ring < 3; ring++) {
      const spread = 0.62 + ring * 0.36;
      ctx.beginPath(); ctx.moveTo(1.35 * u, -spread * u);
      ctx.quadraticCurveTo((2.05 + ring * 0.15) * u, -0.42 * spread * u, (2.45 + ring * 0.2) * u, 0);
      ctx.quadraticCurveTo((2.05 + ring * 0.15) * u, 0.42 * spread * u, 1.35 * u, spread * u); ctx.stroke();

  const tailWag = Math.sin(tick * (chasing ? 0.31 : 0.16) + phase) * (chasing ? 0.45 : 0.22) * u;
  ctx.fillStyle = "#3c4a31"; ctx.beginPath(); ctx.moveTo(-0.9 * u, -0.23 * u);
  ctx.quadraticCurveTo(-1.65 * u, -0.3 * u + tailWag, -2.72 * u, -0.08 * u + tailWag);
  ctx.quadraticCurveTo(-1.85 * u, 0.11 * u + tailWag, -0.85 * u, 0.28 * u); ctx.closePath(); ctx.fill();
  const hide = ctx.createLinearGradient(0, -0.55 * u, 0, 0.62 * u);
  hide.addColorStop(0, "#78804d"); hide.addColorStop(0.38, "#515d39"); hide.addColorStop(1, "#293a32");
  ctx.beginPath(); ctx.moveTo(-1.18 * u, -0.2 * u);
  ctx.bezierCurveTo(-0.88 * u, -0.56 * u, 0.12 * u, -0.55 * u, 0.82 * u, -0.42 * u);
  ctx.lineTo(1.55 * u, -0.36 * u); ctx.lineTo(2.0 * u, -0.24 * u); ctx.lineTo(2.26 * u, -0.12 * u);
  ctx.lineTo(2.3 * u, 0.12 * u); ctx.lineTo(1.86 * u, 0.2 * u); ctx.lineTo(1.47 * u, 0.38 * u);
  ctx.bezierCurveTo(0.52 * u, 0.5 * u, -0.58 * u, 0.43 * u, -1.18 * u, 0.2 * u); ctx.closePath();
  ctx.fillStyle = hide; ctx.fill();
  // Hàm vuông, hàm dưới và các chân ngắn có móng.
  ctx.fillStyle = "#687246"; ctx.beginPath(); ctx.moveTo(1.34 * u, -0.33 * u); ctx.lineTo(2.23 * u, -0.2 * u); ctx.lineTo(2.48 * u, -0.08 * u); ctx.lineTo(2.45 * u, 0.15 * u); ctx.lineTo(1.8 * u, 0.27 * u); ctx.lineTo(1.35 * u, 0.28 * u); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#c8b47a"; ctx.beginPath(); ctx.moveTo(1.62 * u, 0.13 * u); ctx.lineTo(2.43 * u, 0.12 * u); ctx.lineTo(2.24 * u, 0.24 * u); ctx.lineTo(1.67 * u, 0.25 * u); ctx.closePath(); ctx.fill();
  for (let leg = 0; leg < 2; leg++) {
    const lx = (leg ? 0.72 : -0.55) * u, side = leg ? 1 : -1;
    ctx.fillStyle = "#3d4c34"; ctx.beginPath(); ctx.moveTo(lx, side * 0.24 * u); ctx.quadraticCurveTo(lx + 0.22 * u, side * 0.52 * u, lx + 0.52 * u, side * 0.42 * u); ctx.lineTo(lx + 0.38 * u, side * 0.2 * u); ctx.closePath(); ctx.fill();
    for (let claw = 0; claw < 3; claw++) { ctx.beginPath(); ctx.moveTo(lx + (0.42 + claw * 0.06) * u, side * 0.39 * u); ctx.lineTo(lx + (0.56 + claw * 0.06) * u, side * 0.46 * u); ctx.strokeStyle = "#d2c99b"; ctx.lineWidth = 0.035 * u; ctx.stroke(); }
  }
  // Sống lưng vảy gai nhọn.
  for (let spike = 0; spike < 8; spike++) {
    const px = (-0.86 + spike * 0.31) * u, height = (spike % 2 ? 0.22 : 0.3) * u;
    ctx.fillStyle = spike % 2 ? "#8b8b55" : "#9e945b";
    ctx.beginPath(); ctx.moveTo(px - 0.13 * u, -0.39 * u); ctx.lineTo(px, -0.39 * u - height); ctx.lineTo(px + 0.15 * u, -0.38 * u); ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle = "rgba(24,39,30,.55)"; ctx.lineWidth = 0.045 * u;
  for (let scaleMark = 0; scaleMark < 5; scaleMark++) { const px = (-0.72 + scaleMark * 0.34) * u; ctx.beginPath(); ctx.moveTo(px, -0.13 * u); ctx.lineTo(px + 0.12 * u, 0.08 * u); ctx.stroke(); }

    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(ex, ey, glowRadius, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = "#181916"; ctx.beginPath(); ctx.arc(ex + 0.015 * u, ey, 0.035 * u, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
  text(m.id, x, y - 0.72 * scale, { size: 10, align: "center", color: chasing ? "#ffb0a2" : "rgba(238,231,199,.82)" });

function drawGatherPlant(n, sx, surfaceY, scale, tick) {
  if (!n.pos) return;
  const phase = artPhase(n.id), bob = Math.sin(tick * 0.07 + phase) * 0.08;
  ctx.save(); ctx.translate(sx(n.pos[0]), surfaceY); ctx.scale(scale, scale);
  ctx.globalAlpha = n.ready === false ? 0.38 : 1;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (n.kind === "bong_dien_dien") {
    ctx.strokeStyle = "#386b45"; ctx.lineWidth = 0.1;
    for (let stem = 0; stem < 3; stem++) {
      const bx = (stem - 1) * 0.2;
      ctx.beginPath(); ctx.moveTo(bx, 0.38); ctx.quadraticCurveTo(bx - 0.1, -0.3, bx + (stem - 1) * 0.14, -0.93 - bob); ctx.stroke();
      ctx.fillStyle = "#4c8c50"; ctx.beginPath(); ctx.ellipse(bx - 0.22, 0.04 - stem * 0.12, 0.25, 0.1, -0.35, 0, Math.PI * 2); ctx.fill();
    }
    for (let flower = 0; flower < 7; flower++) {
      const fx = ((flower % 3) - 1) * 0.24, fy = -0.72 - Math.floor(flower / 3) * 0.19 - bob;
      for (let petal = 0; petal < 5; petal++) {
        const a = petal * Math.PI * 2 / 5;
        ctx.fillStyle = petal % 2 ? "#f6c94e" : "#ffe27a"; ctx.beginPath(); ctx.ellipse(fx + Math.cos(a) * 0.1, fy + Math.sin(a) * 0.1, 0.12, 0.065, a, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = "#a96c28"; ctx.beginPath(); ctx.arc(fx, fy, 0.055, 0, Math.PI * 2); ctx.fill();
    }
  } else if (n.kind === "bong_sung") {
    ctx.fillStyle = "rgba(49,111,91,.9)";
    for (let leaf = 0; leaf < 3; leaf++) {
      const lx = (leaf - 1) * 0.28, ly = 0.05 + Math.sin(leaf + phase) * 0.04;
      ctx.beginPath(); ctx.ellipse(lx, ly, 0.42, 0.23, (leaf - 1) * 0.42, 0.25, Math.PI * 1.92); ctx.lineTo(lx, ly); ctx.fill();
      ctx.strokeStyle = "rgba(189,220,166,.62)"; ctx.lineWidth = 0.025; ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + 0.28, ly - 0.04); ctx.stroke();
    }
    ctx.strokeStyle = "#4b826d"; ctx.lineWidth = 0.055; ctx.beginPath(); ctx.moveTo(0, 0.1); ctx.quadraticCurveTo(0.08, -0.48, 0.02, -0.8 - bob); ctx.stroke();
    for (let petal = 0; petal < 8; petal++) {
      const a = petal * Math.PI / 4;
      ctx.fillStyle = petal % 2 ? "#d66eaa" : "#f29ac7";
      ctx.beginPath(); ctx.ellipse(0.12 * Math.cos(a), -0.82 - bob + 0.12 * Math.sin(a), 0.18, 0.075, a, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#f4d78c"; ctx.beginPath(); ctx.arc(0, -0.82 - bob, 0.08, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.strokeStyle = "#43834f"; ctx.lineWidth = 0.105;
    for (let stalk = -1; stalk <= 1; stalk++) {
      const x = stalk * 0.16;
      ctx.beginPath(); ctx.moveTo(x, 0.45); ctx.bezierCurveTo(x - 0.08, 0.08, x + 0.1, -0.38, x + 0.04 + bob, -0.92); ctx.stroke();
      for (let leaf = 0; leaf < 3; leaf++) {
        const ly = -0.2 - leaf * 0.22;
        ctx.fillStyle = leaf === 2 ? "#95b665" : "#5d9b58"; ctx.beginPath(); ctx.ellipse(x + (leaf % 2 ? -0.2 : 0.2), ly, 0.25, 0.07, leaf % 2 ? -0.5 : 0.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = "#9abf6a"; ctx.beginPath(); ctx.ellipse(x + bob, -0.94, 0.1, 0.2, -0.08, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

function drawTamBan(meta, sx, scale, oy, tick) {
  const dock = meta.dock_pos || [2, 0], surfaceY = oy + waveHeight(dock[0], tick) * scale;
  ctx.save(); ctx.translate(sx(dock[0]), surfaceY); ctx.scale(scale, scale); ctx.lineJoin = "round"; ctx.lineCap = "round";
  // Cọc tre, dây neo và mái lá dừa nước.
  ctx.strokeStyle = "#80603b"; ctx.lineWidth = 0.12; ctx.beginPath(); ctx.moveTo(-1.55, 0.18); ctx.lineTo(-1.55, -1.85); ctx.moveTo(1.62, 0.1); ctx.lineTo(1.62, -1.72); ctx.stroke();
  ctx.strokeStyle = "#c2a36b"; ctx.lineWidth = 0.04; ctx.beginPath(); ctx.moveTo(-1.72, -0.1); ctx.lineTo(-2.1, -1.9); ctx.lineTo(-1.9, -2.2); ctx.stroke();
  ctx.fillStyle = "#71543a"; ctx.beginPath(); ctx.moveTo(-2.15, -1.9); ctx.quadraticCurveTo(-0.15, -3.15, 1.95, -1.9); ctx.lineTo(1.65, -1.62); ctx.quadraticCurveTo(-0.1, -2.45, -1.9, -1.62); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#9e8053"; ctx.lineWidth = 0.045;
  for (let thatch = 0; thatch < 12; thatch++) { const tx = -1.8 + thatch * 0.31; ctx.beginPath(); ctx.moveTo(tx, -1.92); ctx.quadraticCurveTo(tx + 0.16, -2.35, tx + 0.28, -2.54 + Math.abs(tx) * 0.08); ctx.stroke(); }
  // Thân xuồng ba lá đóng ván thủ công.
  const wood = ctx.createLinearGradient(0, -0.08, 0, 0.72); wood.addColorStop(0, "#bd8954"); wood.addColorStop(0.55, "#845433"); wood.addColorStop(1, "#4f3526");
  ctx.beginPath(); ctx.moveTo(-1.78, 0.03); ctx.quadraticCurveTo(-1.52, 0.48, -0.85, 0.62); ctx.lineTo(1.28, 0.62); ctx.quadraticCurveTo(2.06, 0.44, 2.32, 0.02); ctx.quadraticCurveTo(0.18, 0.3, -1.78, 0.03); ctx.closePath(); ctx.fillStyle = wood; ctx.fill();
  ctx.strokeStyle = "#e0ae6e"; ctx.lineWidth = 0.055;
  for (let plank = 0; plank < 4; plank++) { const py = 0.24 + plank * 0.09; ctx.beginPath(); ctx.moveTo(-1.28, py); ctx.quadraticCurveTo(0.05, py + 0.16, 1.85, py + 0.02); ctx.stroke(); }
  ctx.fillStyle = "#d7b07a"; ctx.beginPath(); ctx.ellipse(-0.9, 0.18, 0.28, 0.1, 0, 0, Math.PI * 2); ctx.ellipse(0.82, 0.2, 0.28, 0.1, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  text("Bến sông · E", sx(dock[0] + 0.2), surfaceY - 3.25 * scale, { size: 11, align: "center", color: "#58452c" });
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 64, bottom = 56;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  const tick = snap.tick || 0;
  const monsters = snap.monsters || [];
  updateMonsterHeadingHistory(monsters, tick);
  // Bầu trời sớm, vệt nắng và bờ cây xa.
  const sky = ctx.createLinearGradient(0, top, 0, oy);
  sky.addColorStop(0, "#b8dce0"); sky.addColorStop(0.62, "#f2d8a7"); sky.addColorStop(1, "#f4c980");
  ctx.fillStyle = sky; ctx.fillRect(0, top, w, oy - top + s * 0.12);
  ctx.fillStyle = "rgba(255,224,153,.88)"; ctx.beginPath(); ctx.arc(sx(X * 0.77), top + 1.45 * s, 0.75 * s, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#74896a"; ctx.beginPath(); ctx.moveTo(sx(0), oy + 0.02 * s);
  ctx.bezierCurveTo(sx(X * 0.13), oy - 1.35 * s, sx(X * 0.25), oy + 0.1 * s, sx(X * 0.39), oy - 0.82 * s);
  ctx.bezierCurveTo(sx(X * 0.55), oy - 1.4 * s, sx(X * 0.66), oy + 0.1 * s, sx(X * 0.78), oy - 0.88 * s);
  ctx.bezierCurveTo(sx(X * 0.87), oy - 1.25 * s, sx(X * 0.94), oy - 0.1 * s, sx(X), oy - 0.65 * s);
  ctx.lineTo(sx(X), oy + 0.1 * s); ctx.lineTo(sx(0), oy + 0.1 * s); ctx.closePath(); ctx.fill();
  // Ba tầng nước phù sa: nâu đỏ nông, xanh lục giữa sông, thẫm bùn ở đáy.
  const water = ctx.createLinearGradient(0, oy, 0, sy(D));
  water.addColorStop(0, "#986b4c"); water.addColorStop(0.11, "#748175");
  water.addColorStop(0.34, "#367b7b"); water.addColorStop(0.62, "#205260");
  water.addColorStop(0.84, "#123746"); water.addColorStop(1, "#071b29");
  traceWaterArea(sx, sy, X, D, s, oy, tick); ctx.fillStyle = water; ctx.fill();
  drawGodRays(sx, sy, X, D, s, oy, tick);
  // Đường độ sâu mảnh và tên ba tầng giúp đọc mặt cắt.
  const depthMarks = [D * 0.16, D * 0.52, D * 0.88];
  const depthNames = ["NÔNG · PHÙ SA", "GIỮA SÔNG", "SÂU · BÙN ĐÁY"];
  for (let band = 0; band < depthMarks.length; band++) {
    const d = depthMarks[band];
    ctx.strokeStyle = band === 2 ? "rgba(217,225,207,.16)" : "rgba(245,245,222,.2)";
    ctx.lineWidth = 1; ctx.setLineDash([4, 7]); ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke(); ctx.setLineDash([]);
    text(depthNames[band], sx(0) + 8, sy(d) - 4, { size: 9, color: "rgba(255,244,220,.78)" });
  }
  // Mặt nước uốn theo sóng; bờ lấp lánh và vệt phù sa sát mép.
  ctx.strokeStyle = "rgba(250,247,215,.9)"; ctx.lineWidth = 2; ctx.beginPath();
  for (let x = 0; x <= X; x += 1) { const y = oy + waveHeight(x, tick) * s; if (x === 0) ctx.moveTo(sx(x), y); else ctx.lineTo(sx(x), y); }
  ctx.stroke();
  ctx.strokeStyle = "rgba(153,91,63,.36)"; ctx.lineWidth = Math.max(1, s * 0.12); ctx.beginPath();
  for (let x = 0; x <= X; x += 2) { const y = oy + waveHeight(x, tick) * s + 0.22 * s; if (x === 0) ctx.moveTo(sx(x), y); else ctx.lineTo(sx(x), y); }
  ctx.stroke();
  const surfaceY = (x) => oy + waveHeight(x, tick) * s;
  drawTamBan(meta, sx, s, oy, tick);
  // Cụm thực vật nổi được vẽ trực tiếp từ các node trong snapshot.
  (snap.nodes || []).forEach((n) => {
    drawGatherPlant(n, sx, surfaceY(n.pos[0]), s, tick);
    text(n.id, sx(n.pos[0]), surfaceY(n.pos[0]) - 1.18 * s, { size: 9, align: "center", color: "rgba(255,250,224,.86)" });
    if (n.ready === false && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), surfaceY(n.pos[0]) + 1.25 * s, { size: 9, align: "center", color: "#fff0cc" });
  });
  // Đàn cá có hình dáng/hoa văn riêng và đuôi quẫy theo nhịp.
  (snap.fish || []).forEach((f) => drawGatherFish(f, sx, sy, s, tick));
  // Cá sấu năm chèo lớn, hướng lấy từ snapshot; ánh mắt và sóng đổi khi săn đuổi.
  monsters.forEach((m) => drawCrocodile(m, snap.player, sx, sy, s, tick));
  // Út Sen bơi ngang, theo đúng góc quay và tọa độ server.
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    const blink = p.invuln_ticks > 0 && Math.floor(tick / 4) % 2 === 0;
    ctx.save(); ctx.translate(px, py); ctx.rotate((p.heading_deg || 0) * Math.PI / 180);
    const u = Math.max(5, s * 0.68), kick = Math.sin(tick * 0.28) * 0.19 * u;
    ctx.globalAlpha = blink ? 0.42 : 1;
    // Chân đạp nước và thân áo bà ba.
    ctx.strokeStyle = "#243d39"; ctx.lineWidth = 0.18 * u; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-0.48 * u, -0.05 * u); ctx.quadraticCurveTo(-0.92 * u, -0.16 * u - kick, -1.18 * u, -0.28 * u - kick); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-0.48 * u, 0.08 * u); ctx.quadraticCurveTo(-0.82 * u, 0.2 * u + kick, -1.04 * u, 0.34 * u + kick); ctx.stroke();
    ctx.fillStyle = "#273f38"; ctx.beginPath(); ctx.ellipse(-1.2 * u, -0.28 * u - kick, 0.17 * u, 0.08 * u, -0.2, 0, Math.PI * 2); ctx.ellipse(-1.06 * u, 0.34 * u + kick, 0.17 * u, 0.08 * u, 0.2, 0, Math.PI * 2); ctx.fill();
    const shirt = ctx.createLinearGradient(0, -0.3 * u, 0, 0.3 * u); shirt.addColorStop(0, "#806044"); shirt.addColorStop(1, "#493b2d");
    ctx.fillStyle = shirt; ctx.beginPath(); ctx.moveTo(-0.62 * u, -0.25 * u); ctx.quadraticCurveTo(-0.14 * u, -0.38 * u, 0.45 * u, -0.2 * u); ctx.lineTo(0.5 * u, 0.19 * u); ctx.quadraticCurveTo(-0.08 * u, 0.36 * u, -0.62 * u, 0.19 * u); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(220,194,150,.8)"; ctx.lineWidth = 0.035 * u; ctx.beginPath(); ctx.moveTo(-0.12 * u, -0.22 * u); ctx.lineTo(-0.1 * u, 0.23 * u); ctx.stroke();
    // Tay quạt nước.
    ctx.strokeStyle = "#bc8059"; ctx.lineWidth = 0.12 * u; ctx.beginPath(); ctx.moveTo(0.22 * u, -0.15 * u); ctx.quadraticCurveTo(0.5 * u, -0.31 * u, 0.78 * u, -0.24 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0.22 * u, 0.14 * u); ctx.quadraticCurveTo(0.48 * u, 0.29 * u, 0.74 * u, 0.25 * u); ctx.stroke();
    // Khăn rằn caro quấn cổ.
    ctx.strokeStyle = "#e4d7b5"; ctx.lineWidth = 0.19 * u; ctx.beginPath(); ctx.moveTo(0.24 * u, -0.19 * u); ctx.lineTo(0.48 * u, -0.14 * u); ctx.stroke();
    ctx.strokeStyle = "#363632"; ctx.lineWidth = 0.025 * u;
    for (let stripe = 0; stripe < 4; stripe++) { const xx = (0.27 + stripe * 0.055) * u; ctx.beginPath(); ctx.moveTo(xx, -0.26 * u); ctx.lineTo(xx - 0.02 * u, -0.04 * u); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(0.24 * u, -0.18 * u); ctx.lineTo(0.48 * u, -0.18 * u); ctx.stroke();
    // Mặt, kính lặn tự chế và vệt phản chiếu mặt nước.
    ctx.fillStyle = "#c98b65"; ctx.beginPath(); ctx.arc(0.58 * u, -0.03 * u, 0.25 * u, 0, Math.PI * 2); ctx.fill();
    for (let lens = 0; lens < 2; lens++) {
      const gx = (lens ? 0.67 : 0.48) * u, gy = -0.1 * u;
      ctx.fillStyle = "#263536"; ctx.beginPath(); ctx.arc(gx, gy, 0.135 * u, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(123,218,224,.78)"; ctx.beginPath(); ctx.arc(gx, gy, 0.095 * u, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,240,.95)"; ctx.lineWidth = 0.035 * u; ctx.beginPath(); ctx.moveTo(gx - 0.055 * u, gy - 0.045 * u); ctx.lineTo(gx + 0.045 * u, gy - 0.08 * u); ctx.stroke();
    }
    if (p.invuln_ticks > 0) { ctx.strokeStyle = blink ? "rgba(255,244,177,.9)" : "rgba(255,244,177,.3)"; ctx.lineWidth = 0.07 * u; ctx.beginPath(); ctx.ellipse(0, 0, 1.42 * u, 0.66 * u, 0, 0, Math.PI * 2); ctx.stroke(); }
    ctx.restore();
  }
  drawParticles(0, sx, sy, s);
  if (p && p.pos) text(`x ${p.pos[0].toFixed(1)}  d ${p.pos[1].toFixed(1)}`, 248, 122, { size: 11, color: "rgba(239,225,199,.82)" });
  if (p && p.catch_cd_ticks > 0) text("Bắt cá " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 248, 140, { size: 10, color: "rgba(239,225,199,.82)" });
  drawGameHud(w, h, snap.mode, snap.phase);
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function roundedPath(x, y, w, h, r) {
  const q = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + q, y); ctx.lineTo(x + w - q, y); ctx.quadraticCurveTo(x + w, y, x + w, y + q);
  ctx.lineTo(x + w, y + h - q); ctx.quadraticCurveTo(x + w, y + h, x + w - q, y + h);
  ctx.lineTo(x + q, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - q);
  ctx.lineTo(x, y + q); ctx.quadraticCurveTo(x, y, x + q, y); ctx.closePath();
}

function drawRiverNight(w, h, left, top, right, bottom, tick) {
  ctx.fillStyle = "#071923"; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = "rgba(125,191,199,.13)";
  for (let i = 0; i < 64; i++) {
    const x = (i * 97 + 31) % Math.max(1, w), y = (i * 67 + 19) % Math.max(1, h);
    if (x >= left && x <= right && y >= top && y <= bottom) continue;
    const twinkle = 0.35 + (Math.sin(tick * 0.075 + i * 1.7) + 1) * 0.28;
    ctx.globalAlpha = twinkle; ctx.beginPath(); ctx.arc(x, y, i % 7 === 0 ? 1.8 : 1, 0, Math.PI * 2); ctx.fill();
    if (i % 7 === 0) { ctx.strokeStyle = "rgba(193,231,227,.32)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x - 4, y); ctx.lineTo(x + 4, y); ctx.moveTo(x, y - 3); ctx.lineTo(x, y + 3); ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  // Những gợn nước lấp lánh chạy ngoài mạn bè.
  ctx.strokeStyle = "rgba(76,150,163,.24)"; ctx.lineWidth = 1;
  for (let i = 0; i < 16; i++) {
    const x = (i * 113 + tick * 0.22) % Math.max(1, w), y = (i * 59 + 83) % Math.max(1, h);
    if (x >= left - 8 && x <= right + 8 && y >= top - 8 && y <= bottom + 8) continue;
    ctx.beginPath(); ctx.ellipse(x, y, 5 + (i % 4) * 2, 1.5, 0, 0, Math.PI * 2); ctx.stroke();
  }
}

function drawBambooRim(sx, sy, X, Z, scale, tick) {
  ctx.strokeStyle = "#4a392d"; ctx.lineWidth = Math.max(2, scale * 0.11); ctx.strokeRect(sx(0), sy(Z), X * scale, Z * scale);
  ctx.strokeStyle = "#9d794b"; ctx.lineWidth = Math.max(1, scale * 0.045);
  ctx.beginPath(); ctx.moveTo(sx(0), sy(Z) + scale * 0.12); ctx.lineTo(sx(X), sy(Z) + scale * 0.12);
  ctx.moveTo(sx(0), sy(0) - scale * 0.1); ctx.lineTo(sx(X), sy(0) - scale * 0.1);
  ctx.moveTo(sx(0) + scale * 0.1, sy(Z)); ctx.lineTo(sx(0) + scale * 0.1, sy(0));
  ctx.moveTo(sx(X) - scale * 0.1, sy(Z)); ctx.lineTo(sx(X) - scale * 0.1, sy(0)); ctx.stroke();
  function post(x, z, phase) {
    const px = sx(x), py = sy(z) + Math.sin(tick * 0.08 + phase) * scale * 0.018, r = scale * 0.12;
    ctx.fillStyle = "#594532"; ctx.beginPath(); ctx.arc(px, py, r * 1.45, 0, Math.PI * 2); ctx.fill();
    const bamboo = ctx.createLinearGradient(px - r, py, px + r, py); bamboo.addColorStop(0, "#806541"); bamboo.addColorStop(0.48, "#d0ae70"); bamboo.addColorStop(1, "#604b31");
    ctx.fillStyle = bamboo; ctx.beginPath(); ctx.ellipse(px, py, r, r * 0.78, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(237,210,151,.7)"; ctx.lineWidth = Math.max(1, scale * 0.025); ctx.beginPath(); ctx.arc(px - r * 0.15, py - r * 0.12, r * 0.62, Math.PI * 1.05, Math.PI * 1.8); ctx.stroke();
  }
  for (let x = 0, i = 0; x <= X; x += 1.5, i++) { post(x, Z, i); post(x, 0, i + 1.4); }
  for (let z = 1.25, i = 0; z < Z; z += 1.5, i++) { post(0, z, i + 2.7); post(X, z, i + 4.1); }
  // Phao tre/bè gỗ nổi ở ngoài mạn, đung đưa nhẹ theo sóng.
  for (let z = 1.2; z < Z; z += 2.2) {
    const bob = Math.sin(tick * 0.09 + z) * scale * 0.035;
    for (const side of [-1, 1]) {
      const px = sx(side < 0 ? 0 : X) + side * scale * 0.28, py = sy(z) + bob;
      ctx.fillStyle = "#392f2a"; ctx.beginPath(); ctx.ellipse(px, py, scale * 0.24, scale * 0.12, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#a97c4d"; ctx.beginPath(); ctx.ellipse(px, py - scale * 0.025, scale * 0.2, scale * 0.075, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(205,238,223,.72)"; ctx.beginPath(); ctx.ellipse(px - scale * 0.07, py - scale * 0.045, scale * 0.055, scale * 0.018, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawFloorBoards(sx, sy, X, Z, scale) {
  const left = sx(0), top = sy(Z), width = X * scale, height = Z * scale;
  ctx.fillStyle = "#5d4037"; ctx.fillRect(left, top, width, height);
  const plankH = Math.max(8, scale * 0.46), rows = Math.ceil(height / plankH);
  for (let row = 0; row < rows; row++) {
    const y = top + row * plankH, h = Math.min(plankH - 2, top + height - y);
    ctx.fillStyle = row % 2 ? "rgba(20,12,10,.16)" : "rgba(196,135,87,.1)"; ctx.fillRect(left, y, width, h);
    ctx.strokeStyle = "rgba(28,18,14,.48)"; ctx.lineWidth = Math.max(1, scale * 0.025); ctx.beginPath(); ctx.moveTo(left, y + plankH - 1); ctx.lineTo(left + width, y + plankH - 1); ctx.stroke();
    for (let grain = 0; grain < 3; grain++) {
      const gx = left + ((row * 71 + grain * 149) % Math.max(1, width - 20));
      const gy = y + plankH * (0.18 + grain * 0.2);
      ctx.strokeStyle = grain === 1 ? "rgba(218,164,115,.15)" : "rgba(36,23,18,.18)"; ctx.lineWidth = Math.max(1, scale * 0.018);
      ctx.beginPath(); ctx.moveTo(gx, gy); ctx.bezierCurveTo(gx + scale * 0.35, gy - scale * 0.05, gx + scale * 0.8, gy + scale * 0.07, Math.min(left + width, gx + scale * 1.25), gy); ctx.stroke();
    }
  }
}

function drawLanternString(sx, sy, Z, scale, tick) {
  ctx.strokeStyle = "#4b352a"; ctx.lineWidth = Math.max(1, scale * 0.035); ctx.beginPath();
  ctx.moveTo(sx(0.8), sy(Z - 0.42)); ctx.quadraticCurveTo(sx(8), sy(Z - 0.9), sx(15.2), sy(Z - 0.42)); ctx.stroke();
  ctx.save(); ctx.globalCompositeOperation = "screen";
  for (let lamp = 0; lamp < 4; lamp++) {
    const x = 1.6 + lamp * 4.25, z = Z - 0.68 - Math.sin(lamp / 3 * Math.PI) * 0.25;
    const px = sx(x), py = sy(z) + Math.sin(tick * 0.12 + lamp) * scale * 0.018, radius = scale * 1.6;
    const glow = ctx.createRadialGradient(px, py, 1, px, py, radius);
    glow.addColorStop(0, "rgba(255,211,128,.23)"); glow.addColorStop(0.5, "rgba(255,181,86,.1)"); glow.addColorStop(1, "rgba(255,163,64,0)");
    ctx.fillStyle = glow; ctx.fillRect(px - radius, py - radius, radius * 2, radius * 2);
  }
  ctx.restore();
  for (let lamp = 0; lamp < 4; lamp++) {
    const x = 1.6 + lamp * 4.25, z = Z - 0.68 - Math.sin(lamp / 3 * Math.PI) * 0.25, px = sx(x), py = sy(z);
    ctx.strokeStyle = "#765237"; ctx.lineWidth = Math.max(1, scale * 0.035); ctx.beginPath(); ctx.moveTo(px, py - scale * 0.42); ctx.lineTo(px, py - scale * 0.19); ctx.stroke();
    ctx.fillStyle = "#bd7941"; ctx.beginPath(); ctx.ellipse(px, py, scale * 0.17, scale * 0.24, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffd783"; ctx.beginPath(); ctx.ellipse(px, py, scale * 0.11, scale * 0.18, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,242,203,.75)"; ctx.lineWidth = Math.max(1, scale * 0.02); ctx.beginPath(); ctx.moveTo(px - scale * 0.12, py); ctx.lineTo(px + scale * 0.12, py); ctx.stroke();
  }
}

function drawReadyStoveGlows(stoves, sx, sy, scale, tick) {
  ctx.save(); ctx.globalCompositeOperation = "screen";
  for (let i = 0; i < stoves.length; i++) {
    const st = stoves[i]; if (st.state !== "ready" || !st.pos) continue;
    const x = sx(st.pos[0]), y = sy(st.pos[1]), r = scale * (1.25 + 0.05 * Math.sin(tick * 0.12 + i));
    const glow = ctx.createRadialGradient(x, y, 1, x, y, r);
    glow.addColorStop(0, "rgba(145,242,196,.32)"); glow.addColorStop(0.55, "rgba(228,207,105,.14)"); glow.addColorStop(1, "rgba(116,230,186,0)");
    ctx.fillStyle = glow; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);

  ctx.restore();
}

function drawEarthenStove(st, sx, sy, scale, tick) {
  if (!st.pos) return;
  const x = sx(st.pos[0]), y = sy(st.pos[1]), u = scale, cooking = st.state === "cooking", ready = st.state === "ready";
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(0, 0.24 * u, 0.88 * u, 0.62 * u, 0, 0, Math.PI * 2); ctx.fill();
  const clay = ctx.createLinearGradient(-0.65 * u, -0.58 * u, 0.62 * u, 0.6 * u);
  clay.addColorStop(0, ready ? "#b76c49" : "#8e5038"); clay.addColorStop(0.48, cooking ? "#bf6742" : "#78452f"); clay.addColorStop(1, "#4b322a");
  ctx.fillStyle = clay; ctx.beginPath(); ctx.ellipse(0, 0.08 * u, 0.72 * u, 0.64 * u, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#d38a5b"; ctx.lineWidth = 0.075 * u; ctx.beginPath(); ctx.ellipse(0, -0.05 * u, 0.58 * u, 0.48 * u, 0, 0, Math.PI * 2); ctx.stroke();
  // Vết nứt mảnh trên thân đất nung.
  ctx.strokeStyle = "rgba(48,31,27,.72)"; ctx.lineWidth = 0.035 * u;
  ctx.beginPath(); ctx.moveTo(-0.52 * u, 0.02 * u); ctx.lineTo(-0.38 * u, 0.12 * u); ctx.lineTo(-0.44 * u, 0.25 * u);
  ctx.moveTo(0.46 * u, 0.12 * u); ctx.lineTo(0.34 * u, 0.2 * u); ctx.lineTo(0.39 * u, 0.34 * u); ctx.stroke();
  // Miệng lò, ánh lửa bập bùng và nồi đất.
  ctx.fillStyle = "#30241f"; ctx.beginPath(); ctx.ellipse(0, -0.18 * u, 0.46 * u, 0.35 * u, 0, 0, Math.PI * 2); ctx.fill();
  if (cooking) {
    const flicker = Math.sin(tick * 0.42 + artPhase(st.id)) * 0.1 * u;
    const flame = ctx.createRadialGradient(0, 0.05 * u, 0, 0, 0.05 * u, 0.43 * u);
    flame.addColorStop(0, "rgba(255,229,127,.95)"); flame.addColorStop(0.5, "rgba(255,120,40,.88)"); flame.addColorStop(1, "rgba(190,55,23,.05)");
    ctx.fillStyle = flame; ctx.beginPath(); ctx.ellipse(0, 0.02 * u, 0.34 * u, 0.25 * u, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffd46d"; ctx.beginPath(); ctx.moveTo(-0.26 * u, -0.2 * u); ctx.quadraticCurveTo(-0.34 * u, -0.58 * u, -0.08 * u, -0.42 * u - flicker); ctx.quadraticCurveTo(0.02 * u, -0.32 * u, 0.04 * u, -0.17 * u); ctx.quadraticCurveTo(0.16 * u, -0.62 * u, 0.29 * u, -0.32 * u + flicker); ctx.quadraticCurveTo(0.34 * u, -0.2 * u, 0.22 * u, -0.11 * u); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = "#49362e"; ctx.beginPath(); ctx.ellipse(0, -0.18 * u, 0.31 * u, 0.24 * u, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = cooking ? "#963e25" : "#7f4a35"; ctx.beginPath(); ctx.ellipse(0, -0.16 * u, 0.26 * u, 0.2 * u, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#d59b65"; ctx.lineWidth = 0.055 * u; ctx.beginPath(); ctx.ellipse(0, -0.18 * u, 0.32 * u, 0.24 * u, 0, Math.PI, Math.PI * 2); ctx.stroke();
  if (cooking) {
    ctx.fillStyle = "rgba(255,230,191,.7)";
    for (let steam = 0; steam < 2; steam++) { const sx0 = (steam - 0.5) * 0.17 * u; ctx.beginPath(); ctx.moveTo(sx0, -0.5 * u); ctx.bezierCurveTo(sx0 - 0.12 * u, -0.68 * u, sx0 + 0.13 * u, -0.76 * u, sx0 + 0.02 * u, -0.92 * u); ctx.strokeStyle = "rgba(255,236,208,.55)"; ctx.lineWidth = 0.035 * u; ctx.stroke(); }
  }
  ctx.restore();
  text(st.id, x, y + 0.78 * scale, { size: 10, align: "center", color: "#f2dfc0" });
  if (st.dish) text(st.dish.dish_id || st.dish, x, y - 0.77 * scale, { size: 9, align: "center", color: ready ? "#d8f6cf" : "#f3d4ad" });
  if (cooking && st.cook_ticks_left !== undefined) text(Math.ceil(st.cook_ticks_left / 60) + "s", x, y + 1.04 * scale, { size: 9, align: "center", color: "#ffe0a5" });
  if (ready) { ctx.fillStyle = "rgba(197,255,222,.92)"; ctx.beginPath(); ctx.arc(x + 0.48 * scale, y - 0.42 * scale, 0.09 * scale, 0, Math.PI * 2); ctx.fill(); }
}

function drawMealPlate(x, y, radius, dishId, tick) {
  const id = dishId || "", hotpot = id.indexOf("lau") >= 0, soup = hotpot || id.indexOf("canh_chua") >= 0;
  ctx.save(); ctx.translate(x, y);

  porcelain.addColorStop(0, "#fffdf2"); porcelain.addColorStop(0.72, "#e9eee5"); porcelain.addColorStop(1, "#a7c0bd");
  ctx.fillStyle = porcelain; ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = "#f2ca64"; ctx.beginPath(); ctx.arc(-radius * 0.08, -radius * 0.12, radius * 0.12, 0, Math.PI * 2); ctx.fill();
  } else if (soup) {
    ctx.fillStyle = "#dc7040"; ctx.beginPath(); ctx.ellipse(0, 0, radius * 0.63, radius * 0.56, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#f2b766"; ctx.lineWidth = Math.max(1, radius * 0.08); ctx.beginPath(); ctx.arc(0, 0, radius * 0.49, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#4d8a50"; ctx.beginPath(); ctx.ellipse(radius * 0.18, -radius * 0.12, radius * 0.14, radius * 0.07, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#f2d06c"; ctx.beginPath(); ctx.arc(-radius * 0.2, radius * 0.12, radius * 0.1, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = id.indexOf("ca_loc") >= 0 || id.indexOf("ca_keo") >= 0 ? "#996040" : "#d7974e";
    ctx.beginPath(); ctx.ellipse(0, 0, radius * 0.57, radius * 0.3, -0.24, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#e6bb68"; ctx.beginPath(); ctx.moveTo(radius * 0.4, -radius * 0.1); ctx.lineTo(radius * 0.68, 0); ctx.lineTo(radius * 0.4, radius * 0.12); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#edc27c"; ctx.lineWidth = Math.max(1, radius * 0.07); ctx.beginPath(); ctx.moveTo(-radius * 0.3, 0); ctx.quadraticCurveTo(0, -radius * 0.26, radius * 0.25, -radius * 0.04); ctx.stroke();
    ctx.fillStyle = "#4b8c50"; ctx.beginPath(); ctx.ellipse(-radius * 0.1, -radius * 0.27, radius * 0.14, radius * 0.07, 0.5, 0, Math.PI * 2); ctx.fill();
  }
  // Hơi nóng uốn nhẹ trên món vừa dọn.
  ctx.strokeStyle = "rgba(255,246,222,.72)"; ctx.lineWidth = Math.max(1, radius * 0.055);
  for (let wisp = 0; wisp < 2; wisp++) { const wx = (wisp - 0.5) * radius * 0.34, sway = Math.sin(tick * 0.12 + wisp) * radius * 0.08; ctx.beginPath(); ctx.moveTo(wx, -radius * 0.72); ctx.bezierCurveTo(wx - radius * 0.12, -radius * 1.05, wx + radius * 0.16 + sway, -radius * 1.12, wx + sway, -radius * 1.36); ctx.stroke(); }
  ctx.restore();
}

function shortDishName(id) {
  if (!id) return "Món nhà";
  if (id.indexOf("canh_chua") >= 0) return "Canh chua";
  if (id.indexOf("lau_mam") >= 0) return "Lẩu mắm";
  if (id.indexOf("lau_ca_linh") >= 0) return "Lẩu cá linh";
  if (id.indexOf("goi_bong_sung") >= 0) return "Gỏi bông súng";
  if (id.indexOf("ca_loc") >= 0) return "Cá lóc nướng";
  if (id.indexOf("ca_keo") >= 0) return "Cá kèo nướng";
  return id.replace(/_/g, " ");
}

function patientColor(ratio) {
  const green = [103, 190, 113], yellow = [232, 187, 73], red = [222, 79, 69];
  const a = ratio > 0.5 ? yellow : red, b = ratio > 0.5 ? green : yellow;
  const t = ratio > 0.5 ? (ratio - 0.5) * 2 : ratio * 2;
  return "rgb(" + a.map((value, index) => Math.round(value + (b[index] - value) * t)).join(",") + ")";
}

function drawCustomer(c, tb, sx, sy, scale, patienceMax, tick) {
  const x = sx(tb.pos[0]), y = sy(tb.pos[1]) - 1.48 * scale, eating = c.state === "eating";
  const color = artPhase(c.id);
  ctx.fillStyle = "rgba(0,0,0,.24)"; ctx.beginPath(); ctx.ellipse(x, y + 0.25 * scale, 0.44 * scale, 0.23 * scale, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = color > 3 ? "#567b65" : "#86523d"; ctx.beginPath(); ctx.ellipse(x, y + 0.25 * scale, 0.38 * scale, 0.24 * scale, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#d9a27a"; ctx.beginPath(); ctx.arc(x, y, 0.22 * scale, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#3b3028"; ctx.beginPath(); ctx.arc(x, y - 0.06 * scale, 0.22 * scale, Math.PI, Math.PI * 2); ctx.fill();
  // Nón lá nhìn từ trên xuống với nan tre tỏa tâm.
  const hat = ctx.createRadialGradient(x - 0.1 * scale, y - 0.3 * scale, 0.03 * scale, x, y - 0.19 * scale, 0.48 * scale);
  hat.addColorStop(0, "#f4e4b8"); hat.addColorStop(0.7, "#cfb77e"); hat.addColorStop(1, "#8c764c");
  ctx.fillStyle = hat; ctx.beginPath(); ctx.ellipse(x, y - 0.2 * scale, 0.49 * scale, 0.31 * scale, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(111,88,51,.7)"; ctx.lineWidth = Math.max(1, scale * 0.02);
  for (let rib = 0; rib < 7; rib++) { const a = rib * Math.PI / 6; ctx.beginPath(); ctx.moveTo(x, y - 0.2 * scale); ctx.lineTo(x + Math.cos(a) * 0.45 * scale, y - 0.2 * scale + Math.sin(a) * 0.27 * scale); ctx.stroke(); }
  ctx.strokeStyle = "#f6dfac"; ctx.lineWidth = Math.max(1, scale * 0.035); ctx.beginPath(); ctx.ellipse(x, y - 0.2 * scale, 0.49 * scale, 0.31 * scale, 0, 0, Math.PI * 2); ctx.stroke();
  if (eating) {
    ctx.strokeStyle = "#fff2cc"; ctx.lineWidth = Math.max(1, scale * 0.035); ctx.beginPath(); ctx.arc(x, y + 0.03 * scale, 0.1 * scale, 0.15, Math.PI - 0.15); ctx.stroke();
    ctx.fillStyle = "#ffd56c"; ctx.beginPath(); ctx.arc(x + 0.4 * scale, y - 0.42 * scale, 0.13 * scale, 0, Math.PI * 2); ctx.fill();
    text("♥", x + 0.4 * scale, y - 0.37 * scale, { size: Math.max(9, scale * 0.16), align: "center", color: "#7b4435" });
  } else {
    // Bong bóng suy nghĩ hiển thị món khách đang đợi.
    const bw = 2.02 * scale, bh = 0.53 * scale, bx = x - bw / 2, by = y - 1.03 * scale;
    ctx.fillStyle = "rgba(250,246,225,.96)"; roundedPath(bx, by, bw, bh, 0.19 * scale); ctx.fill();
    ctx.strokeStyle = "rgba(111,82,54,.72)"; ctx.lineWidth = Math.max(1, scale * 0.025); ctx.stroke();
    ctx.fillStyle = "#faf6e1"; ctx.beginPath(); ctx.arc(x - 0.18 * scale, y - 0.43 * scale, 0.08 * scale, 0, Math.PI * 2); ctx.arc(x - 0.24 * scale, y - 0.55 * scale, 0.045 * scale, 0, Math.PI * 2); ctx.fill();
    text(shortDishName(c.dish_id), x, by + bh * 0.67, { size: Math.max(8, scale * 0.14), align: "center", color: "#533b2c" });
    if (c.patience_ticks_left !== undefined) {
      const ratio = Math.max(0, Math.min(1, c.patience_ticks_left / patienceMax)), bw2 = 0.96 * scale, bh2 = Math.max(4, 0.085 * scale), py = y + 0.63 * scale;
      roundedPath(x - bw2 / 2, py, bw2, bh2, bh2 / 2); ctx.fillStyle = "rgba(19,24,22,.65)"; ctx.fill();
      roundedPath(x - bw2 / 2 + 1, py + 1, Math.max(0, (bw2 - 2) * ratio), bh2 - 2, Math.max(1, (bh2 - 2) / 2)); ctx.fillStyle = patientColor(ratio); ctx.fill();
    }
  }
}

function drawDiningTable(tb, customer, sx, sy, scale, tick, patienceMax) {
  const x = sx(tb.pos[0]), y = sy(tb.pos[1]), radius = 0.82 * scale;
  ctx.fillStyle = "rgba(0,0,0,.34)"; ctx.beginPath(); ctx.ellipse(x, y + 0.18 * scale, radius * 1.18, radius * 0.92, 0, 0, Math.PI * 2); ctx.fill();
  const wood = ctx.createRadialGradient(x - radius * 0.35, y - radius * 0.38, 1, x, y, radius);
  wood.addColorStop(0, "#bb8650"); wood.addColorStop(0.65, "#805334"); wood.addColorStop(1, "#472f27");
  ctx.fillStyle = wood; ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#d0a16b"; ctx.lineWidth = Math.max(1, scale * 0.045); ctx.beginPath(); ctx.arc(x, y, radius * 0.9, 0, Math.PI * 2); ctx.stroke();
  // Mẹt tre/khăn vải giản dị và thớ nan tỏa tâm.
  ctx.strokeStyle = "rgba(229,190,127,.48)"; ctx.lineWidth = Math.max(1, scale * 0.018);
  for (let weave = 0; weave < 5; weave++) { const yy = y + (weave - 2) * radius * 0.22; ctx.beginPath(); ctx.moveTo(x - radius * 0.63, yy); ctx.quadraticCurveTo(x, yy + (weave % 2 ? 0.03 : -0.03) * scale, x + radius * 0.63, yy); ctx.stroke(); }
  ctx.fillStyle = "rgba(242,221,175,.9)"; ctx.beginPath(); ctx.arc(x, y, radius * 0.43, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#9d794e"; ctx.lineWidth = Math.max(1, scale * 0.025); ctx.beginPath(); ctx.arc(x, y, radius * 0.43, 0, Math.PI * 2); ctx.stroke();
  text(tb.id, x, y + radius * 0.78, { size: 9, align: "center", color: "#f5e1bf" });
  if (customer && customer.state === "eating") drawMealPlate(x, y, radius * 0.39, customer.dish_id, tick);
  if (customer) drawCustomer(customer, tb, sx, sy, scale, patienceMax, tick);
}

function drawQuanPlayer(player, hand, sx, sy, scale, tick) {
  if (!player || !player.pos) return;
  const x = sx(player.pos[0]), y = sy(player.pos[1]), carrying = !!hand;
  ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(x, y + 0.2 * scale, 0.37 * scale, 0.2 * scale, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#285c55"; ctx.beginPath(); ctx.ellipse(x, y + 0.12 * scale, 0.31 * scale, 0.4 * scale, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#d09870"; ctx.beginPath(); ctx.arc(x, y - 0.17 * scale, 0.2 * scale, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#342c25"; ctx.beginPath(); ctx.arc(x, y - 0.23 * scale, 0.21 * scale, Math.PI, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#d09870"; ctx.lineWidth = Math.max(2, scale * 0.075); ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x - 0.18 * scale, y - 0.02 * scale); ctx.quadraticCurveTo(x - 0.34 * scale, y - (carrying ? 0.57 : 0.2) * scale, x - 0.23 * scale, y - (carrying ? 0.78 : 0.1) * scale); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 0.18 * scale, y - 0.02 * scale); ctx.quadraticCurveTo(x + 0.34 * scale, y - (carrying ? 0.57 : 0.2) * scale, x + 0.23 * scale, y - (carrying ? 0.78 : 0.1) * scale); ctx.stroke();
  if (carrying) {
    const dishId = typeof hand === "string" ? hand : hand.dish_id;
    drawMealPlate(x, y - 0.78 * scale, 0.39 * scale, dishId, tick);
    text(shortDishName(dishId), x, y - 1.44 * scale, { size: 9, align: "center", color: "#fff0cb" });
  }
}

function drawQuan(w, h) {
  const meta = snap.meta && snap.meta.quan ? snap.meta.quan : snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 64, bottom = 40;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  const tick = snap.tick || 0;
  const left = sx(0), right = sx(X), boardTop = sy(Z), boardBottom = sy(0);
  drawRiverNight(w, h, left, boardTop, right, boardBottom, tick);
  drawFloorBoards(sx, sy, X, Z, s);
  drawNightLighting(snap, sx, sy, X, Z, s, tick);
  drawReadyStoveGlows(snap.stoves || [], sx, sy, s, tick);
  drawLanternString(sx, sy, Z, s, tick);
  drawBambooRim(sx, sy, X, Z, s, tick);
  const stoves = snap.stoves || [];
  stoves.forEach((st) => drawEarthenStove(st, sx, sy, s, tick));
  // Khách hàng theo table_id; món chỉ xuất hiện trên mẹt sau khi khách bắt đầu ăn.
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  const tables = snap.tables || [];
  tables.forEach((tb) => drawDiningTable(tb, byTable[tb.id], sx, sy, s, tick, patMax));
  // Người phục vụ vẫn ở tọa độ player.pos; đĩa hiện rõ trên hai tay khi hand có món.
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    drawQuanPlayer(p, snap.hand, sx, sy, s, tick);
  }
  drawParticles(1, sx, sy, s);
  drawGameHud(w, h, snap.mode, snap.phase);
}

let lastFrameTime = 0;
function frame(now) {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const dt = lastFrameTime ? Math.max(0, Math.min(3, (now - lastFrameTime) / (1000 / 60))) : 1;
  lastFrameTime = now;
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    stepParticleSystem(dt, snap.mode === "quan" || (snap.mode === "day" && snap.phase === "quan") ? 1 : 0);
    if (snap.mode === "day" && snap.phase === "shop") drawQuan(w, h);
    else if (snap.mode === "quan" || (snap.mode === "day" && snap.phase === "quan")) drawQuan(w, h);
    else drawGather(w, h);
    eventLog(w, h);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
